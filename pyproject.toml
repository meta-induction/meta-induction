[build-system]
requires = ["setuptools>=67.0"]
build-backend = "setuptools.build_meta"
[project]
name = "meta-induction"
version = "0.0.1"
authors = [
    {name="Machina Ratiocinatrix", email="machina.ratio@gmail.com"},
    {name="Alexander Fedotov", email="alex.fedotov@aol.com"}
]
description = "Meta-induction"
readme = "README.md"
requires-python = ">=3.10"
classifiers=[
        "Programming Language :: Python :: 3",
        "License :: OSI Approved :: MIT License",
        "Operating System :: OS Independent",
]

keywords = ["meta-induction"]

dependencies = [
    "pyyaml == 6.0.3"
]

[project.scripts]
meta-induction = "meta_induction.cli:run"

[project.urls]
"Homepage" = "https://github.com/meta-induction/meta-induction"